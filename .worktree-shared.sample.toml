[shared]
# Shared data is stored outside individual Git worktrees.
root = "_shared"

[[link]]
path = "data"
# 格納先を参照名と変える場合だけ指定する。"." はcommon直下を参照する。
# source = "."
mode = "shared"
kind = "dir"

[[link]]
path = "results"
mode = "per_worktree"
kind = "dir"

[[link]]
path = ".env"
mode = "shared"
kind = "file"
create = false
